<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 300px;
            height: 300px;
            border: 2px solid black;
            display: flex;
            justify-content: space-around;
            align-items: center;
         
        }
        #box1, #box2, #box3{
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #box1{
            background-color: red;
        }
        #box2{
            background-color: green;
        }
        #box3{
            background-color: blue;
        }   
    </style>
</head>
<body>
    <div id="container">
        <div class="box" id="box1">Box1</div>
        <div class="box" id="box2">Box2</div>
        <div class="box" id="box3">Box3</div>
            
    </div>


    <script>
        let container = document.getElementById('container');
        let box1 = document.querySelector('#box1');
        let box2 = document.querySelector('#box2');
        let box3 = document.querySelector('#box3');

        container.addEventListener('click', (e)=>{
            // console.log('Container Clicked');
            console.log(e.target.innerText) // target will give the element which is clicked(ex: it will console <div class="box" id="box1">Box1</div>) and target.innerText will give the text of that element (ex: it will console Box1)

            console.log(e.target)

        })
      


    </script>
</body>
</html>
