<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 300px;
            height: 300px;
            border: 2px solid black;
            display: flex;
            justify-content: space-around;
            align-items: center;
         
        }
        .box1, .box2, .box3{
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box1{
            background-color: red;
        }
        .box2{
            background-color: green;
        }
        .box3{
            background-color: blue;
        }   
    </style>
</head>
<body>
    <div id="container">
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
        <div class="box3">Box3</div>
            
    </div>


    <script>
        let container = document.getElementById('container');
        let box1 = document.querySelector('.box1');
        let box2 = document.querySelector('.box2');
        let box3 = document.querySelector('.box3');

        container.addEventListener('click', function(){
            alert('Container Clicked');
        });

        box1.addEventListener('click', function(event){
            alert('Box 1 Clicked');
            event.stopPropagation();
        });

        box2.addEventListener('click', function(){
            alert('Box 2 Clicked');
        });

        box3.addEventListener('click', function(){
            alert('Box 3 Clicked');
        });

        //stop propagation will stop the event from bubbling up to the parent elements. In this case, when you click on Box 1, it will trigger the alert for Box 1 but will not trigger the alert for the container. However, clicking on Box 2 or Box 3 will still trigger the alert for the container because they do not have stopPropagation() called on their click events.

        


    </script>
</body>
</html>
