<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
        <div class="box">Box 5</div>

    </div>

    <script>
      let box = document.createElement('div'); // Creating a new element
      box.innerText = "Box 6"; // Setting the inner text
      box.setAttribute('class', 'box'); // Setting an attribute

      let container = document.querySelector('.container'); // Selecting the container
      container.append(box, "hi", "hello"); // Adding the new element to the 
      
    //   append vs appendChild
    //   container.appendChild(box); // appendChild only accepts a single node  

    
    </script>
</body>
</html>
